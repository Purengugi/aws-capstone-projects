<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 680" width="100%" height="100%">
  <defs>
    <style>
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 13px; fill: #232f3e; font-weight: 500; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 15px; fill: #16191f; font-weight: 700; }
      .header-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; fill: #ffffff; font-weight: 700; }
      .subtext { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; font-size: 11px; fill: #545b64; }
      .arrow { stroke: #232f3e; stroke-width: 1.8; fill: none; marker-end: url(#arrowhead); }
      .arrow-dashed { stroke: #0073bb; stroke-width: 1.8; stroke-dasharray: 5,5; fill: none; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#232f3e" />
    </marker>
    <marker id="arrowhead-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0073bb" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="950" height="680" fill="#ffffff" />

  <!-- Outer AWS Cloud Box -->
  <rect x="20" y="20" width="910" height="640" rx="8" fill="#ffffff" stroke="#7d8998" stroke-width="1.5" />
  <rect x="20" y="20" width="90" height="24" rx="4" fill="#ec7211" />
  <text x="28" y="37" class="header-tag">AWS Cloud</text>

  <!-- Route 53 (External / Top Right) -->
  <g transform="translate(750, 45)">
    <circle cx="28" cy="28" r="24" fill="#8c4fff" />
    <path d="M18 20 L38 20 L38 24 L20 24 L20 28 L36 28 L36 32 L18 32 Z" fill="#ffffff" />
    <text x="28" y="66" text-anchor="middle" class="label">Amazon Route 53</text>
    <text x="28" y="80" text-anchor="middle" class="subtext">DNS Routing</text>
  </g>

  <!-- Internet Gateway (IGW) -->
  <g transform="translate(435, 45)">
    <circle cx="28" cy="28" r="24" fill="#8c4fff" />
    <rect x="20" y="16" width="16" height="24" rx="2" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <path d="M28 22 L28 34 M24 26 L28 22 L32 26" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" fill="none" />
    <text x="28" y="66" text-anchor="middle" class="label">Internet Gateway</text>
    <text x="28" y="80" text-anchor="middle" class="subtext">0.0.0.0/0</text>
  </g>

  <!-- VPC Container -->
  <rect x="40" y="110" width="870" height="530" rx="6" fill="#ffffff" stroke="#248814" stroke-width="2" />
  <rect x="40" y="110" width="70" height="22" rx="3" fill="#248814" />
  <text x="48" y="126" class="header-tag">VPC</text>
  <text x="120" y="126" class="title">Production VPC (10.0.0.0/16)</text>

  <!-- Availability Zone 1A Container -->
  <rect x="60" y="145" width="830" height="475" rx="6" fill="#fcf9f5" stroke="#eb5f07" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="60" y="145" width="160" height="22" rx="3" fill="#eb5f07" />
  <text x="68" y="161" class="header-tag">Availability Zone 1A</text>

  <!-- Public Subnet Container -->
  <rect x="80" y="180" width="370" height="420" rx="6" fill="#eaf7eb" stroke="#248814" stroke-width="1.2" />
  <rect x="80" y="180" width="140" height="20" rx="3" fill="#248814" />
  <text x="86" y="195" class="header-tag">Public Subnet (10.0.1.0/24)</text>

  <!-- Frontend Web Server Box inside Public Subnet -->
  <rect x="110" y="225" width="310" height="150" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" />
  <rect x="130" y="245" width="46" height="46" rx="4" fill="#ec7211" />
  <!-- EC2 Server Icon graphic -->
  <rect x="138" y="253" width="30" height="30" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M143 268 L163 268 M148 261 L148 275 M158 261 L158 275" stroke="#ffffff" stroke-width="1.5" />
  <text x="190" y="260" class="title">Frontend Web Server</text>
  <text x="190" y="278" class="label">Amazon EC2 (Apache / PHP)</text>
  <text x="190" y="295" class="subtext">Auto-assign Public IPv4: Yes</text>
  <text x="190" y="312" class="subtext">Security Group: Allow Port 80</text>
  <rect x="125" y="335" width="280" height="26" rx="4" fill="#e8f4fd" />
  <text x="135" y="352" class="subtext" fill="#0073bb">Public Users Access Website over HTTP</text>

  <!-- NAT Gateway Box inside Public Subnet -->
  <rect x="110" y="405" width="310" height="170" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" />
  <rect x="130" y="425" width="46" height="46" rx="4" fill="#8c4fff" />
  <circle cx="153" cy="448" r="14" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M147 448 L159 448 M153 442 L153 454" stroke="#ffffff" stroke-width="2" />
  <text x="190" y="440" class="title">NAT Gateway</text>
  <text x="190" y="458" class="label">Elastic IP Attached</text>
  <text x="190" y="475" class="subtext">Translates Private DB Requests</text>
  <rect x="125" y="495" width="280" height="65" rx="4" fill="#fdf2e9" />
  <text x="135" y="513" class="subtext" fill="#ec7211">Requirement 1 Solution:</text>
  <text x="135" y="530" class="subtext">Allows Database server to perform</text>
  <text x="135" y="547" class="subtext">outbound updates without public IP.</text>

  <!-- Private Subnet Container -->
  <rect x="490" y="180" width="380" height="420" rx="6" fill="#edf4fa" stroke="#0073bb" stroke-width="1.2" />
  <rect x="490" y="180" width="150" height="20" rx="3" fill="#0073bb" />
  <text x="496" y="195" class="header-tag">Private Subnet (10.0.2.0/24)</text>

  <!-- Database Box inside Private Subnet -->
  <rect x="520" y="225" width="320" height="170" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" />
  <rect x="540" y="245" width="46" height="46" rx="4" fill="#0073bb" />
  <!-- DB Cylinders Icon graphic -->
  <ellipse cx="563" cy="256" rx="14" ry="4" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M549 256 L549 276 A14 4 0 0 0 577 276 L577 256" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M549 266 A14 4 0 0 0 577 266" fill="none" stroke="#ffffff" stroke-width="1.5" />
  <text x="600" y="260" class="title">Backend Database Server</text>
  <text x="600" y="278" class="label">Amazon EC2 (MariaDB/MySQL)</text>
  <text x="600" y="295" class="subtext">Private IP Only (No Public IP)</text>
  <text x="600" y="312" class="subtext">Security Group: Port 3306 (Web SG Only)</text>
  <rect x="535" y="330" width="290" height="50" rx="4" fill="#f2f3f3" />
  <text x="545" y="348" class="subtext">Default Route 0.0.0.0/0 points to NAT</text>
  <text x="545" y="365" class="subtext">No direct inbound routes from Internet</text>

  <!-- AWS Systems Manager (SSM) Session Manager Box -->
  <rect x="520" y="420" width="320" height="155" rx="6" fill="#ffffff" stroke="#d5dbdb" stroke-width="1" />
  <rect x="540" y="435" width="46" height="46" rx="4" fill="#8c4fff" />
  <!-- SSM Lock/Terminal Icon -->
  <rect x="549" y="446" width="28" height="24" rx="3" fill="none" stroke="#ffffff" stroke-width="2" />
  <path d="M555 458 L560 453 M555 464 L565 464" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <text x="600" y="450" class="title">SSM Session Manager</text>
  <text x="600" y="468" class="label">Remote Admin Access</text>
  <rect x="535" y="495" width="290" height="65" rx="4" fill="#f3e8fd" />
  <text x="545" y="513" class="subtext" fill="#8c4fff">Requirement 2 Solution:</text>
  <text x="545" y="530" class="subtext">Encrypted browser shell for developer.</text>
  <text x="545" y="547" class="subtext">Zero open ports: No SSH (22) needed.</text>

  <!-- Interconnecting Arrows -->
  <!-- IGW to Web Server -->
  <path d="M435 70 L265 70 L265 220" class="arrow" />
  <!-- IGW to NAT Gateway -->
  <path d="M465 95 L465 470 L425 470" class="arrow" />
  <!-- Web Server to DB (Port 3306) -->
  <path d="M420 280 L515 280" class="arrow" />
  <rect x="430" y="268" width="80" height="18" rx="2" fill="#ffffff" stroke="#7d8998" stroke-width="1" />
  <text x="470" y="281" text-anchor="middle" class="subtext">Port 3306</text>

  <!-- DB Outbound to NAT Gateway for Updates -->
  <path d="M520 310 L470 310 L470 435 L425 435" class="arrow-dashed" />
  <rect x="435" y="360" width="75" height="18" rx="2" fill="#ffffff" stroke="#0073bb" stroke-width="1" />
  <text x="472" y="373" text-anchor="middle" class="subtext" fill="#0073bb">Updates</text>

</svg>
